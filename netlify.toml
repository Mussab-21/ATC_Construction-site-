# Netlify Configuration for ATC (Azaan Trading & Contracting)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."

# Custom security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static stylesheets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static scripts
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache data files
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images & media assets
[[headers]]
  for = "/assests/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache PDF Brochure
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Cache Video assets
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# Canonical & Friendly redirects
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/brochure"
  to = "/ATC%20%C3%97%20Rising%20Sun%20%E2%80%94%20Company%20Profile%202026%20%2014-page%20Editable%20Brochure%20(2).pdf"
  status = 302

[[redirects]]
  from = "/ATC_Company_Profile_2026.pdf"
  to = "/ATC%20%C3%97%20Rising%20Sun%20%E2%80%94%20Company%20Profile%202026%20%2014-page%20Editable%20Brochure%20(2).pdf"
  status = 302
